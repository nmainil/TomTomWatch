name: Build

# Builds TomTomWatch.jar (jar-with-dependencies) on each push to master.
# The jar is available as artifact on the workflow run page (Actions tab).
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for the git-commit-id-plugin build info

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # If javadoc ever blocks the build, add -Dmaven.javadoc.skip=true here
      - name: Build and test
        run: mvn -B package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: TomTomWatch-${{ github.sha }}
          path: |
            target/TomTomWatch.jar
            target/tomtomwatch.properties
          if-no-files-found: error
